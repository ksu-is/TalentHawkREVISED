<!DOCTYPE html>
<html>
<head>
    <title>TalentHawk - Soccer Talent Analytics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav-link {
            color: #0066cc;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            background-color: #f5f5f5;
        }
        .nav-link:hover {
            background-color: #e5e5e5;
        }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .player-card {
            background-color: #f5f5f5;
            border-radius: 5px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }
        .player-card:hover {
            transform: translateY(-5px);
        }
        .player-card h2 {
            color: #333;
            margin: 0 0 15px 0;
            text-align: center;
        }
        .player-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-item {
            background-color: white;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>TalentHawk</h1>
        <p>Soccer Talent Analytics</p>
    </div>

    <div class="nav-links">
        <a href="{{ url_for('home') }}" class="nav-link">Players</a>
        <a href="{{ url_for('compare_players') }}" class="nav-link">Compare Players</a>
        <a href="{{ url_for('analytics') }}" class="nav-link">Analytics</a>
    </div>

    <div class="players-grid">
        {% for player_id, player in players.items() %}
        <a href="{{ url_for('player_detail', player_id=player_id) }}" class="player-card">
            <h2>{{ player.name }}</h2>
            <div class="player-stats">
                <div class="stat-item">
                    <div class="stat-label">Position</div>
                    <div class="stat-value">{{ player.position }}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Age</div>
                    <div class="stat-value">{{ player.age }}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Goals</div>
                    <div class="stat-value">{{ player.stats.goals }}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Assists</div>
                    <div class="stat-value">{{ player.stats.assists }}</div>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>
</body>
</html>
